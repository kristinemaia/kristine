<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Outfit:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0}.s{width:1080px;height:1080px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#fbf7f2;position:relative;overflow:hidden}
.blob{position:absolute;width:760px;height:760px;border-radius:46% 54% 60% 40%/50% 42% 58% 50%;background:conic-gradient(from 200deg,#e8506b,#f2a93b,#1fb5a5,#7a4fd6,#e8506b);filter:blur(2px);opacity:.92}
.in{position:absolute;width:640px;height:640px;border-radius:52% 48% 44% 56%/46% 56% 44% 54%;background:#fbf7f2}
.t{position:relative;font-family:Fraunces,serif;font-weight:800;font-size:190px;line-height:.9;color:#1d1a24;letter-spacing:-6px;text-align:center}
.t span{display:block;background:linear-gradient(90deg,#e8506b,#7a4fd6,#1fb5a5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{position:relative;font-family:Outfit,sans-serif;font-size:34px;letter-spacing:12px;color:#5b5566;margin-top:26px}
.h{width:1600px;height:500px;flex-direction:row;gap:50px}.h .blob{width:380px;height:380px;left:70px}.h .in{width:320px;height:320px;left:100px}
.h .mark{position:absolute;left:150px;font-family:Fraunces,serif;font-weight:800;font-size:150px;color:#1d1a24}
</style></head><body>
<div class="s" id="sq"><div class="blob"></div><div class="in"></div><div class="t">Art<span>Flow</span></div><div class="sub">İSTANBUL</div></div>

</body></html>
